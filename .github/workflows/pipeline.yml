name: MCA DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install App Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: mcadevopsreg2026.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t mcadevopsreg2026.azurecr.io/mca-devops-app:latest .
        docker push mcadevopsreg2026.azurecr.io/mca-devops-app:latest