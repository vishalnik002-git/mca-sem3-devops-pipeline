name: MCA DevOps CI/CD Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/docker-login@v2
        with:
          login-server: mcadevopsreg2026.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push image
        run: |
          docker build -t mcadevopsreg2026.azurecr.io/mca-devops-app:${{ github.sha }} -t mcadevopsreg2026.azurecr.io/mca-devops-app:latest .
          docker push mcadevopsreg2026.azurecr.io/mca-devops-app:${{ github.sha }}
          docker push mcadevopsreg2026.azurecr.io/mca-devops-app:latest
